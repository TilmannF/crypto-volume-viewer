name: Bug
description: Something incorrect or unsafe in the CLI or GUI
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tool only opens containers **you already have the password for**. Do not attach private volumes.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - GUI (Crypto Volume Viewer)
        - CLI (`cryptovol`)
        - Both / unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a git SHA"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: Steps, expected, actual. No passwords.
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Container / filesystem (if known)
      placeholder: "e.g. file-hosted .hc, AES-XTS, SHA-512, FAT LFN"
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I am not asking for password recovery or brute force.
          required: true
        - label: I did not paste a real password, keyfile, or private container.
          required: true

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRYPTOVOL_STATIC_FAT_FIXTURE: ${{ github.workspace }}/testdata/static/tcvc-aes-sha512-fat-files.hc
  CRYPTOVOL_STATIC_FAT_LFN_FIXTURE: ${{ github.workspace }}/testdata/static/tcvc-aes-sha512-fat-lfn-unicode.hc
  CRYPTOVOL_STATIC_EXFAT_LFN_FIXTURE: ${{ github.workspace }}/testdata/static/tcvc-aes-sha512-exfat-lfn-unicode.hc
  CRYPTOVOL_STATIC_NTFS_LFN_FIXTURE: ${{ github.workspace }}/testdata/static/tcvc-aes-sha512-ntfs-lfn-unicode.hc
  # Do not set CRYPTOVOL_STATIC_CRYPTO_MATRIX_DIR here: those ignored tests
  # autoprobing extra KDFs can run for tens of minutes on CI.

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Linux Tauri/WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Placeholder frontend dist for Tauri context
        shell: bash
        run: |
          mkdir -p apps/cryptovol-gui/dist
          printf '%s\n' '<!doctype html><title>ci</title>' > apps/cryptovol-gui/dist/index.html
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets
      - name: fixture tests (ignored)
        shell: bash
        run: |
          # Skip cryptovol-cli ignored tests: they spawn the binary and some
          # omit --kdf, which forces a long KDF autoprobe. VeraCrypt CLI
          # scripts are not run here.
          cargo test --workspace --all-targets --exclude cryptovol-cli -- --ignored

  gui:
    name: gui frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cryptovol-gui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/cryptovol-gui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # E2E is a local macOS Tauri/WebDriver suite. Not run in CI.

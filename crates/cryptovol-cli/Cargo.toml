[package]
name = "cryptovol-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cryptovol"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
cryptovol-app = { path = "../cryptovol-app" }
cryptovol-core = { path = "../cryptovol-core" }
cryptovol-fs-exfat = { path = "../cryptovol-fs-exfat" }
cryptovol-fs-fat = { path = "../cryptovol-fs-fat" }
cryptovol-fs-ntfs = { path = "../cryptovol-fs-ntfs" }
cryptovol-tcvc = { path = "../cryptovol-tcvc" }
rpassword = "7.5.4"
secrecy = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
libc = "0.2"
